name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust format & clippy
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      - name: Install dependencies & build
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-benchmark pydantic pyxsdata
          pip install .

      - name: Rust unit tests
        run: cargo test

      - name: Run tests
        run: pytest --cov


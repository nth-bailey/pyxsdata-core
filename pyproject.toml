[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyxsdata-core"
version = "0.1.0"
description = "Ultra-fast native XML data binding core for pyxsdata"
readme = "README.md"
authors = [{ name = "Bailey Nguyen", email = "bailey.tan.nguyen@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/nth-bailey/pyxsdata-core"
Documentation = "https://nth-bailey.github.io/pyxsdata-core/"
Repository = "https://github.com/nth-bailey/pyxsdata-core"
Issues = "https://github.com/nth-bailey/pyxsdata-core/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pyxsdata_core._pyxsdata_core"
